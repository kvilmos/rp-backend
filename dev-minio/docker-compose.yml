version: '3.8'

services:
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: minio-server
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ./minio-data:/data
    environment:
      MINIO_ROOT_USER: minioadmin     
      MINIO_ROOT_PASSWORD: minioadmin  
    command: server /data --console-address ":9001"

volumes:
  minio-data: