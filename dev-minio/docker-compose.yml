version: "3.8"

services:
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: minio-server
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      MINIO_SERVER_URL: "http://s3.rp"
      MINIO_NOTIFY_WEBHOOK_ENABLE_GOAPP1: "on"
      MINIO_NOTIFY_WEBHOOK_ENDPOINT_GOAPP1: "http://host.docker.internal:4747/minio/upload-hook"
    volumes:
      - ./minio-data:/data
    command: server /data --console-address ":9001"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  minio-setup:
    image: minio/mc
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 5; 
      /usr/bin/mc alias set myminio http://minio:9000 minioadmin minioadmin;
      /usr/bin/mc mb myminio/furniture-models --ignore-existing;
      /usr/bin/mc anonymous set download myminio/furniture-models;
      /usr/bin/mc event add myminio/furniture-models arn:minio:sqs::GOAPP1:webhook --event put;
      /usr/bin/mc event add myminio/furniture-thumbnails arn:minio:sqs::GOAPP1:webhook --event put;
      "

volumes:
  minio-data:
